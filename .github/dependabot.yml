version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # vue-tsc doesn't support TypeScript 7 (Go port) yet
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      nuxt:
        patterns: ['nuxt', '@nuxt/*', 'nuxt-*', 'vue', 'vue-*']
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
