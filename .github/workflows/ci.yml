name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json (setting both fails)
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrations up to date?
        run: |
          pnpm db:generate --name ci-check
          if [ -n "$(git status --porcelain server/db/migrations)" ]; then
            echo "::error::Schema changed without a migration. Run 'pnpm db:generate --name <name>' locally and commit the result."
            git status --porcelain server/db/migrations
            exit 1
          fi

      - name: Build
        run: pnpm build
